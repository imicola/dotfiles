[theme]
mode = "dark"
shell_mode = "follow"
source = "custom"
custom_palette = "HydrangeaNight"
pure_black_dark = false
sync_color_scheme = true

[shell]
font_family = "Noto Sans CJK SC"
lang = "zh-CN"
avatar_path = "/home/imicola/.local/share/hydrangea-night/claude-avatar.jpg"
setup_wizard_enabled = false
polkit_agent = false
telemetry_enabled = false
external_ip_enabled = false
corner_radius_scale = 0.9
date_format = "%Y年%m月%d日 %A"
time_format = "{:%H:%M}"
clipboard_enabled = true
settings_window_translucent = true
circular_avatar = false

[shell.animation]
enabled = true
speed = 1.5

[shell.greeter_sync]
auto_sync = true

[shell.shadow]
direction = "down"
alpha = 0.35

[shell.panel]
transparency_mode = "glass"
border_color = "outline_variant"
border_width = 1.0
control_center_placement = "floating"
control_center_position = "top_right"
launcher_placement = "floating"
launcher_position = "center"
floating_offset = 12

[shell.launcher]
fetch_exchange_rates = false
layout = "full"
width = 700
search_position = "top"
default_view = "pinned"
app_grid = false
pinned = ["microsoft-edge", "org.kde.dolphin", "kitty", "dev.zed.Zed", "qq", "wechat"]

[bar]
order = ["default"]

[bar.default]
position = "top"
thickness = 43
margin_edge = 10
margin_ends = 12
margin_opposite_edge = 8
padding = 16
widget_spacing = 8
background_opacity = 0.85
capsule_opacity = 0.85
compositor_blur = true
radius = 14
radius_top_left = 14
radius_top_right = 14
radius_bottom_left = 14
radius_bottom_right = 14
concave_edge_corners = false
border = "outline_variant"
border_width = 1
shadow = true
reserve_space = true
layer = "top"
start = ["launcher", "workspaces", "active_window"]
center = ["clock", "weather"]
end = ["media", "privacy", "tray", "notifications", "network", "volume", "battery", "control-center", "safe-session"]

scale = 1.04
font_scale = 1.04
[widget.launcher]
custom_image = "/home/imicola/.local/share/hydrangea-night/claude-avatar.jpg"
custom_image_colorize = false

[widget.workspaces]
style = "regular"
show_labels = true
label_source = "id"
max_label_chars = 2
active_pill_size = 1.5
inactive_pill_size = 1.0
empty_color = "surface_container"

[widget.active_window]
min_length = 40
max_length = 130

[widget.clock]
format = "{:%m月%d日  %a  %H:%M}"

[widget.clock.actions]
left = "panel-toggle control-center calendar"
right = "panel-toggle control-center weather"

[widget.weather]
max_length = 95
show_condition = false
show_temperature = true

[widget.media]
min_length = 40
max_length = 110
hide_artist = true
hide_when_no_media = true
title_scroll = "on_hover"

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"

[widget.ram]
type = "sysmon"
stat = "ram_used"

[widget.network]
show_label = false

[widget.volume]
show_label = true

[widget.volume.actions]
right = "volume-mute"
scroll_up = "volume-up 5%"
scroll_down = "volume-down 5%"

[widget.brightness]
show_label = false

[widget.battery]
display_mode = "glyph"
show_label = true
label_content = "percent"

[widget.safe-session]
type = "custom_button"
glyph = "power"
tooltip = "会话菜单 · Super+X · 保留关机/重启确认"
color = "error"

[widget.safe-session.actions]
left = "exec /home/imicola/.local/bin/niri-power-menu"
right = "exec /home/imicola/.local/bin/niri-lock"

[control_center]
sidebar = "compact"
sidebar_section = "compact"
width = 660
show_avatar_border = false
show_session_button = false
show_shortcut_labels = true

[control_center.media]
show_visualizer = false

[location]
auto_locate = false
address = "哈尔滨"
latitude = 45.75
longitude = 126.65

[weather]
enabled = true
refresh_minutes = 30
unit = "metric"
effects = false

[wallpaper]
enabled = true
directory = "/home/imicola/图片"
fill_mode = "crop"
transition = ["fade"]
transition_duration = 300
transition_on_startup = false

[wallpaper.default]
path = "/home/imicola/.local/share/hydrangea-night/wallpaper.jpg"

[wallpaper.automation]
enabled = false

[backdrop]
enabled = true
blur_intensity = 0.45
tint_intensity = 0.35

[notification]
enable_daemon = true
background_opacity = 0.85
position = "top_right"
offset_x = 14
offset_y = 68
width = 360
max_visible = 3

[osd]
position = "top_center"
offset_y = 68
background_opacity = 0.85
hide_delay_ms = 1200

[lockscreen]
enabled = true
lock_before_suspend = true
grace_period_seconds = 0
allow_empty_password = false
fingerprint = false
blurred_desktop = false
wallpaper = "/home/imicola/.local/share/hydrangea-night/wallpaper.jpg"
transition = ["fade"]
transition_duration = 250
blur_intensity = 0.03
tint_intensity = 0.30

[idle]
pre_action_fade_seconds = 1

[idle.behavior.lock]
enabled = true
timeout = 600
action = "lock"

[idle.behavior.screen-off]
enabled = true
timeout = 900
action = "screen_off"

[idle.behavior.lock-and-suspend]
enabled = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = ["night-clock", "night-date", "lockscreen-login-box@eDP-1"]

[lockscreen_widgets.grid]
visible = false
cell_size = 16
major_interval = 4

[lockscreen_widgets.widget.night-clock]
type = "clock"
output = "eDP-1"
cx = 1380
cy = 375
box_width = 440
box_height = 130
placement_width = 1782
placement_height = 1188

[lockscreen_widgets.widget.night-clock.settings]
format = "{:%H:%M}"
center_text = true
background = false
color = "on_surface"
shadow = true

[lockscreen_widgets.widget.night-date]
type = "clock"
output = "eDP-1"
cx = 1380
cy = 475
box_width = 440
box_height = 48
placement_width = 1782
placement_height = 1188

[lockscreen_widgets.widget.night-date.settings]
format = "{:%m月%d日 %A}"
center_text = true
background = false
color = "on_surface"
shadow = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
type = "login_box"
output = "eDP-1"
cx = 1380
cy = 640
box_width = 480
box_height = 150
placement_width = 1782
placement_height = 1188

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
layout = "compact"
background_color = "surface_container"
background_opacity = 0.85
background_radius = 20
input_opacity = 1.0
input_radius = 10
show_login_button = true
show_session_buttons = false
show_media = false
show_weather = false
show_caps_lock = true
show_keyboard_layout = true
show_unlock_hint = false
show_password_reveal = true

[dock]
enabled = false

[audio]
enable_volume_sounds = false
enable_screenshot_sounds = false

[system.monitor]
cpu_poll_seconds = 3
memory_poll_seconds = 3

[shell.session.power]
shutdown = "/home/imicola/.local/bin/niri-confirm-power shutdown"
reboot = "/home/imicola/.local/bin/niri-confirm-power reboot"

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["kcolorscheme"]

[widget.tray]
drawer = true
drawer_columns = 4
drawer_item_size = 28
drawer_background_opacity = 0.85

[widget.control-center.actions]
right = "panel-toggle clipboard"

[desktop_widgets]
enabled = true
schema_version = 2
widget_order = ["desk-clock", "desk-weather", "desk-calendar", "desk-cpu", "desk-memory"]

[desktop_widgets.grid]
visible = false
cell_size = 16
major_interval = 4

[desktop_widgets.widget.desk-clock]
type = "clock"
output = "eDP-1"
cx = 1450
cy = 190
box_width = 150
box_height = 150
placement_width = 1782
placement_height = 1188

[desktop_widgets.widget.desk-clock.settings]
background = true
background_color = "surface"
background_opacity = 0.85
background_radius = 18
background_padding = 14
font_family = "Noto Sans CJK SC"
shadow = false
clock_style = "analog"
circle = true
show_seconds = false
color = "primary"

[desktop_widgets.widget.desk-weather]
type = "weather"
output = "eDP-1"
cx = 1620
cy = 190
box_width = 150
box_height = 150
placement_width = 1782
placement_height = 1188

[desktop_widgets.widget.desk-weather.settings]
background = true
background_color = "surface"
background_opacity = 0.85
background_radius = 18
background_padding = 14
font_family = "Noto Sans CJK SC"
shadow = false
show_forecast = false
color = "on_surface"

[desktop_widgets.widget.desk-calendar]
type = "calendar"
output = "eDP-1"
cx = 1535
cy = 470
box_width = 320
box_height = 360
placement_width = 1782
placement_height = 1188

[desktop_widgets.widget.desk-calendar.settings]
background = true
background_color = "surface"
background_opacity = 0.85
background_radius = 18
background_padding = 14
font_family = "Noto Sans CJK SC"
show_events = false
show_week_numbers = false

[desktop_widgets.widget.desk-cpu]
type = "sysmon"
output = "eDP-1"
cx = 1450
cy = 725
box_width = 150
box_height = 105
placement_width = 1782
placement_height = 1188

[desktop_widgets.widget.desk-cpu.settings]
background = true
background_color = "surface"
background_opacity = 0.85
background_radius = 18
background_padding = 14
font_family = "Noto Sans CJK SC"
shadow = false
stat = "cpu_usage"
stat2 = "cpu_temp"
display = "graph"
color = "secondary"
color2 = "primary"
show_label = true

[desktop_widgets.widget.desk-memory]
type = "sysmon"
output = "eDP-1"
cx = 1620
cy = 725
box_width = 150
box_height = 105
placement_width = 1782
placement_height = 1188

[desktop_widgets.widget.desk-memory.settings]
background = true
background_color = "surface"
background_opacity = 0.85
background_radius = 18
background_padding = 14
font_family = "Noto Sans CJK SC"
shadow = false
stat = "ram_pct"
stat2 = "swap_pct"
display = "graph"
color = "primary"
color2 = "secondary"
show_label = true
