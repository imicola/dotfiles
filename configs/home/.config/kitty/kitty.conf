font_family Maple Mono NF CN
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0
shell /usr/bin/zsh
initial_window_width 100c
initial_window_height 28c
remember_window_size no
window_padding_width 10
confirm_os_window_close -1
background_opacity 0.85
background #24273a
foreground #cad3f5
cursor #f4dbd6
selection_background #5b6078
selection_foreground #cad3f5
color0 #494d64
color1 #ed8796
color2 #a6da95
color3 #eed49f
color4 #8aadf4
color5 #f5bde6
color6 #8bd5ca
color7 #b8c0e0
color8 #5b6078
color9 #ed8796
color10 #a6da95
color11 #eed49f
color12 #8aadf4
color13 #f5bde6
color14 #8bd5ca
color15 #a5adcb

# 启用光标拖尾（单位：毫秒）
cursor_trail 1

# 拖尾衰减时间（秒）
cursor_trail_decay 0.1 0.25

# 触发拖尾的最小移动距离（字符格）
cursor_trail_start_threshold 1

# 光标样式
cursor_shape block

# 平滑呼吸式闪烁
cursor_blink_interval 0.5 ease-in-out

# 背景透明度
background_opacity 0.80

# 请求背景模糊
background_blur 1

# 紫阳花夜色：在原设置之后覆盖视觉参数。
include hydrangea-night.conf
include themes/hydrangea-night-pinned.conf
include themes/noctalia.conf
