patch:
  speller/algebra/+:
  - derive/^([zcs])h/$1/
  - derive/^([zcs])([^h])/$1h$2/
  - derive/ang$/an/
  - derive/an$/ang/
  - derive/eng$/en/
  - derive/en$/eng/
  - derive/in$/ing/
  - derive/ing$/in/
  engine/processors:
  - lua_processor@*select_character
  - ascii_composer
  - recognizer
  - key_binder
  - speller
  - punctuator
  - selector
  - navigator
  - express_editor
  engine/filters:
  - lua_filter@*is_in_user_dict
  - lua_filter@*corrector
  - reverse_lookup_filter@radical_reverse_lookup
  - lua_filter@*autocap_filter
  - lua_filter@*v_filter
  - lua_filter@*pin_cand_filter
  - lua_filter@*reduce_english_filter
  - lua_filter@*aux_lookup_filter
  - simplifier@emoji
  - simplifier@chaifen
  - simplifier@chaifen_all
  - simplifier@chinese_english
  - simplifier@traditionalize
  - simplifier@mars
  - uniquifier
  switches/@0/reset: 0
  ascii_composer/switch_key/Shift_L: commit_code
  ascii_composer/switch_key/Shift_R: commit_code
